name: Build native Firas AI Android

on:
  workflow_dispatch:
  push:
    branches: ["codex/android-**"]
    paths: ["android/**", ".github/workflows/build-android-apk.yml"]

permissions:
  contents: write

concurrency:
  group: firas-android-preview
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Preserve the preview signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: firas-android-preview-signing-v1
      - name: Validate and build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -PfirasBuild=${{ github.run_number }} --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk FirasAI-preview.apk
          sha256sum FirasAI-preview.apk > FirasAI-preview.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-build-evidence
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: FirasAI-Android-preview
          path: |
            android/FirasAI-preview.apk
            android/FirasAI-preview.sha256
      - name: Publish Android preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-build-${{ github.run_number }}"
          printf 'Native Kotlin/Compose Android preview. Source: %s\n\nSigned preview APK for testing. Local runtime evidence and limitations are documented in android/README.md.\n' "$GITHUB_SHA" > "$RUNNER_TEMP/android-release.md"
          gh release create "$TAG" FirasAI-preview.apk FirasAI-preview.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Firas AI Android preview ${{ github.run_number }}" --notes-file "$RUNNER_TEMP/android-release.md"
