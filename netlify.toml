# Netlify config for the Firas AI EDGE version.
# The static frontend (index.html / app.js / styles.css / firebase-config.js) is
# served from the repo root; ONE edge function owns all /api/* routes
# (netlify/edge-functions/api.js). The original server.mjs is unused by Netlify —
# this deploy is driven entirely by the edge function + static files.

[build]
  publish = "."
  command = ""            # no build step (vanilla, zero-dependency frontend)
  # Background functions live here. Edge functions cannot outlive their response, so a
  # Firas Agent mission died the moment the tab closed; a *-background function is a
  # 15-minute Node invocation that keeps running after the client is gone.
  functions = "netlify/functions"

[[edge_functions]]
  path = "/api/*"
  function = "api"

# Firebase auth proxy: serve the Google sign-in handler from OUR OWN domain so the auth
# flow is FIRST-PARTY. This is what makes "Continue with Google" work in Safari — its
# tracking prevention (ITP) blocks the cross-domain firebaseapp.com handler. firebase-config.js
# sets authDomain to this site's own host; these rewrites forward the handler to Firebase.
[[redirects]]
  from = "/__/auth/*"
  to = "https://firas-ai.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://firas-ai.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

# Static files serve automatically for every non-/api path — all routes are real
# files (/, /index.html, /app.js, /styles.css, /firebase-config.js). The edge
# function intercepts every /api/* request and returns 404 for unknown api paths.

# ── Caching ──────────────────────────────────────────────────────────────────
# HTML always revalidates; JS/CSS serve instantly from browser cache for 5 min
# and refresh in the background (stale-while-revalidate) — repeat visits boot
# with zero asset round-trips, and a deploy fully propagates within minutes.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

# Model weights and brand marks never change without changing NAME, so a year-long
# immutable cache is correct — the 21 MB upscaler downloads once per visitor, ever.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers (all pages) ─────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # microphone=(self): the app's OWN origin must be allowed or voice dictation
    # and the voice call can never get a mic stream in production — `microphone=()`
    # blocks every origin including this one, so getUserMedia was failing on the
    # deployed site while working fine on localhost (which has no such header).
    # camera/geolocation stay fully denied — nothing in the app uses them.
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    # CSP kept narrow ON PURPOSE — mirrors server.mjs. script-src/img-src/connect-src are
    # omitted because Firas Code renders every user project in a srcdoc iframe, and srcdoc
    # INHERITS this policy: any subresource directive would break real projects (blob: module
    # imports, CDN scripts, inline handlers, remote images). The zero-click image-exfil vector
    # is closed at the sanitizer instead — see installPurifyHooks() in app.js. These two
    # directives nothing legitimate needs: <base> hijacking and plugin embeds.
    Content-Security-Policy = "base-uri 'self'; object-src 'none'"

# ── Hide non-frontend repo files from the public deploy (publish = ".") ──────
# Backend source, docs and config are not secrets by themselves, but exposing
# them maps the attack surface for free. Serve 404 for all of them.
[[redirects]]
  from = "/server.mjs"
  to = "/index.html"
  status = 404
  force = true

# The whole backend directory. `publish = "."` uploads the repo root, and the denylist
# below names files by extension — neither of which covered netlify/edge-functions/api.js,
# which was verifiably fetchable at 200. The background runner added here would be served
# the same way. A trailing splat is required: Netlify only honours a glob at the END of the
# path, which is why the /*.md-style rules below match nothing in a subdirectory.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.toml"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.yaml"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/index.html"
  status = 404
  force = true
